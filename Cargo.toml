[package]
name = "version-control-rs"
description = "SVN-like version control engine in Rust (library + CLI)."
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/ARyaskov/version-control-rs"
keywords = [
    "svn",
    "version-control"
]
categories = [
    "development-tools",
    "command-line-utilities"
]

[lib]
name = "version_control_rs"
path = "src/lib.rs"

[[bin]]
name = "vcrs"
path = "src/main.rs"

[features]
default = ["serve-http"]
# The HTTP/WebDAV server and its heavy async/XML/compression stack. Disable with
# `--no-default-features` for a much smaller, faster-to-build CLI/library.
serve-http = ["dep:actix-web", "dep:quick-xml", "dep:uuid", "dep:flate2", "dep:argon2", "dep:password-hash"]

[dependencies]
actix-web = { version = "4.11", optional = true }
argon2 = { version = "0.5", optional = true }
# Salt generation for argon2 password hashes (OS randomness).
password-hash = { version = "0.5", features = ["getrandom"], optional = true }
base64 = "0.22"
blake3 = "1.5"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
quick-xml = { version = "0.38", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.10", features = ["v4"], optional = true }
walkdir = "2.5"
similar = "2.6"
rusqlite = { version = "0.32", features = ["bundled"] }
diffy = "0.4"
globset = "0.4"
flate2 = { version = "1.0", optional = true }

[dev-dependencies]
tempfile = "3"
